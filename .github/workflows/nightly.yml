name: nightly

# Automatic nightly releases: builds all firmware variants from the default
# branch (master) and publishes them as a rolling "nightly" pre-release.
# - Runs every night on a schedule (cron is in UTC!)
# - Can also be triggered manually from the Actions tab
# - Skips the build/release if master hasn't changed since the last nightly
#   (use the "force" input on manual runs to override)

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC daily (03:00 CEST / 02:00 CET Warsaw time)
  workflow_dispatch:
    inputs:
      force:
        description: "Build and release even if there are no new commits"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  check:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force || 'false' }}" = "true" ]; then
            echo "Forced run — building regardless of new commits."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if STATUS=$(gh api "repos/${{ github.repository }}/compare/nightly...${GITHUB_SHA}" --jq .status 2>/dev/null); then
            echo "Compare status vs 'nightly' tag: $STATUS"
          else
            STATUS="no-previous-nightly"
            echo "No previous 'nightly' tag found — first run."
          fi

          if [ "$STATUS" = "identical" ]; then
            echo "No new commits since last nightly — skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build-${{ matrix.suffix }}
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: ajjjjjjjj/opentx-docker-i6x:1.5.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: I6X
            suffix: std
          - board: I6X_DFPLAYER
            suffix: std-dfplayer
          - board: I6X_HELI
            suffix: heli
          - board: I6X_HELI_DFPLAYER
            suffix: heli-dfplayer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build OpenI6X
        run: python3 ./tools/build-flysky.py -b${{ matrix.board }} -tALL "${GITHUB_WORKSPACE}"

      - name: Package per-board ZIP
        run: |
          NIGHT=$(date -u +%Y%m%d)
          BOARD=$(printf '%s' "${{ matrix.board }}" | tr '[:upper:]' '[:lower:]')
          export ZIP_NAME="output/open${BOARD}_${NIGHT}.zip"
          python3 <<'EOF'
          import zipfile, glob, os, sys
          name = os.environ["ZIP_NAME"]
          bins = sorted(glob.glob("output/*.bin"))
          if not bins:
              sys.exit("ERROR: no .bin files found in output/")
          with zipfile.ZipFile(name, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for f in bins:
                  z.write(f, os.path.basename(f))
          print("Created %s (%d files):" % (name, len(bins)))
          for f in bins:
              print("  - " + os.path.basename(f))
          EOF

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.suffix }}
          path: output/*.zip
          if-no-files-found: error

  release:
    name: Publish nightly release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # gives gh a proper git repo context (it shells out to git)

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v4
        with:
          path: nightly
          merge-multiple: true

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }} # never let gh guess the repo from git remotes
        run: |
          DATE=$(date -u +%Y-%m-%d)
          SHA_SHORT="${GITHUB_SHA::7}"

          # ---- changelog: what changed since the previous nightly ----
          # Each entry: - [abc1234](commit-url) Subject (@github-author)
          # Fallback for the very first run (no nightly tag yet):
          # list the last 10 commits on the branch.
          PREV_SHA=""
          CHANGELOG_LINK=""
          if gh api "repos/${GH_REPO}/compare/nightly...${GITHUB_SHA}" > compare.json 2>/dev/null; then
            PREV_SHA=$(jq -r '.base_commit.sha' compare.json)
            TOTAL=$(jq '.commits | length' compare.json)
            CHANGELOG_HEADING="Changes since previous nightly (\`${PREV_SHA:0:7}\`)"
            jq -r '.commits[] | "- [\(.sha[0:7])](\(.html_url)) \(.commit.message | split("\n")[0])" + (if .author.login then " (@" + .author.login + ")" else "" end)' compare.json 2>/dev/null | head -n 30 > changes.md || true
            if [ "${TOTAL:-0}" -gt 30 ]; then
              echo "- …and $((TOTAL - 30)) more commits" >> changes.md
            fi
            CHANGELOG_LINK="**Full changelog:** ${GITHUB_SERVER_URL}/${GH_REPO}/compare/${PREV_SHA}...${GITHUB_SHA}"
          else
            echo "No previous 'nightly' tag — using the last 10 commits as changelog."
            CHANGELOG_HEADING="First nightly — recent commits"
            gh api "repos/${GH_REPO}/commits?sha=${GITHUB_SHA}&per_page=10" \
              --jq '.[] | "- [\(.sha[0:7])](\(.html_url)) \(.commit.message | split("\n")[0])" + (if .author.login then " (@" + .author.login + ")" else "" end)' > changes.md 2>/dev/null || true
          fi
          [ -s changes.md ] || echo "_No commit changes found._" > changes.md

          {
            echo "### OpenI6X nightly — ${DATE}"
            echo ""
            echo "Automatic nightly build of \`master\` @ ${SHA_SHORT}."
            echo ""
            echo "Each ZIP contains all language versions for one board variant: \`I6X\` · \`I6X_DFPLAYER\` · \`I6X_HELI\` · \`I6X_HELI_DFPLAYER\`."
            echo "Flash the \`.bin\` from the ZIP matching your radio variant and preferred language."
            echo ""
            echo "#### ${CHANGELOG_HEADING}"
            echo ""
            cat changes.md
            if [ -n "$CHANGELOG_LINK" ]; then
              echo ""
              echo "$CHANGELOG_LINK"
            fi
          } > notes.md

          # Mirror the notes into the Actions run summary so they are also
          # visible on the workflow run page, not just the release page
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            cat notes.md >> "$GITHUB_STEP_SUMMARY"
          fi

          # ---- rolling 'nightly' tag: force-push ----
          # git handles both cases (create on first run, move afterwards) with no
          # existence checks — the refs API GET prefix-matches (a GET for "nightly"
          # also "finds" e.g. "nightly-latest") while PATCH needs an exact ref,
          # which caused HTTP 422 here before.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "${GITHUB_SHA}"
          git push -f origin "refs/tags/nightly"

          # ---- one-time cleanup of the pre-existing 'nightly-latest' tag/release ----
          # (no-op once they are gone; kept so re-runs stay self-healing)
          gh release delete nightly-latest --yes || true
          git push origin :refs/tags/nightly-latest || true

          # ---- replace the previous nightly release (the tag itself is kept) ----
          gh release delete nightly --yes || true

          gh release create nightly \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Nightly ${DATE}" \
            --notes-file notes.md \
            nightly/*.zip \
          || gh release upload nightly --clobber nightly/*.zip
